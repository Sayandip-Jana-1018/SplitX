# ═══════════════════════════════════════════════════════════════
#   SplitX — Kind Cluster Configuration
#   Creates a local Kubernetes cluster named "splitx-demo"
#   inside Docker containers (zero AWS cost)
# ═══════════════════════════════════════════════════════════════

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: splitx-demo

nodes:
  - role: control-plane
    # Port mappings so we can access services from the browser
    extraPortMappings:
      # ArgoCD UI (HTTPS)
      - containerPort: 30443
        hostPort: 8090
        protocol: TCP
      # ArgoCD UI (HTTP — redirects to HTTPS)
      - containerPort: 30080
        hostPort: 8091
        protocol: TCP
      # SplitX app (if deployed via Helm)
      - containerPort: 30000
        hostPort: 3002
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
