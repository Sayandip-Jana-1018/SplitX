# ═══════════════════════════════════════════════════════════════
#   SplitX — local rehearsal cluster
#
#   Three nodes so scheduling is real: pods spread across two
#   workers, and the control plane stays free of application load
#   (as it is on EKS, where the control plane is AWS-managed).
#
#   The node image is pinned by digest and matches the EKS version
#   used for the demo, so the rehearsal runs the same Kubernetes
#   the graded demo runs.
#
#   Create with: npm run k8s:up   (scripts/cluster-up.mjs)
# ═══════════════════════════════════════════════════════════════
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: splitx

nodes:
  # The control plane also carries ingress-nginx: its container publishes
  # 80/443 on the host, which is how a browser on Windows reaches the app.
  - role: control-plane
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  - role: worker
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
  - role: worker
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
