# ═══════════════════════════════════════════════════════════════
#   AWS overlay — EKS, behind an ALB and CloudFront.
#
#   Differences from local, and why each one exists:
#     • the image is pulled from ghcr.io — the one GitHub Actions built,
#       scanned and signed (D-054), the same digest Jenkins deploys here
#     • no in-cluster Postgres: EKS talks to Neon, like the deployed site
#     • two proxies in front of a pod (CloudFront -> ALB), not one
#     • replicas spread across availability zones, not just nodes
#     • the ServiceAccount carries an IRSA role
#
#   Phase 7 fills in the account id, the hostname and the certificate, and
#   applies it. `npm run k8s:render` renders it today so the difference
#   between the two environments is reviewable in a pull request.
# ═══════════════════════════════════════════════════════════════
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: splitx

resources:
  - ../../base

components:
  - ../../components/redis

images:
  - name: splitx
    # The public package GitHub Actions publishes and signs. Jenkins replaces
    # this with the digest of the release it is deploying (D-055); the tag
    # here is the last release, so what this renders today is a real image
    # that exists — never a moving tag, which would make a rollback
    # meaningless (D-059).
    newName: ghcr.io/sayandip-jana-1018/splitx
    newTag: 52137218e1d4

patches:
  - path: patches/serviceaccount.yaml
  - path: patches/ingress.yaml
  - path: patches/ingress-internal.yaml
  - path: patches/deployment.yaml

configMapGenerator:
  - name: splitx-config
    behavior: merge
    literals:
      # CloudFront -> ALB -> pod: the visitor's address is second from the right
      # of X-Forwarded-For. Getting this wrong would rate-limit the ALB instead
      # of the visitor, or let a visitor forge an address and dodge the limit.
      - TRUSTED_PROXY_HOPS=2
      - NEXTAUTH_URL=https://REPLACE_WITH_PUBLIC_HOSTNAME
