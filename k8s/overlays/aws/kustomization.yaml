# ═══════════════════════════════════════════════════════════════
#   AWS overlay: EKS, behind CloudFront and an Application Load Balancer
#   (D-093). `node scripts/cluster-up.mjs --target eks` applies it on an AWS
#   day, and Jenkins on EKS deploys every later release with it.
#
#   Differences from local, and why each one exists:
#     • the image is pulled from ghcr.io: the one GitHub Actions built,
#       scanned and signed (D-054), the same digest Jenkins deploys here
#     • no in-cluster Postgres: EKS talks to a Neon branch that has the
#       schema and none of production's data (splitx/demo/app, D-091)
#     • two proxies in front of a pod (CloudFront -> ALB), not one
#     • one plain-HTTP listener, which admits only CloudFront's addresses:
#       CloudFront holds the HTTPS certificate and the visitor's connection,
#       and the app accepts only requests carrying our edge's header (D-092)
#     • replicas spread across availability zones, not just nodes
#     • rollouts wait for the load balancer, in both directions
#     • network policies with EKS's addresses (patches/networkpolicy.yaml)
#
#   The Secret splitx-secrets is made from Secrets Manager by the External
#   Secrets Operator (k8s/eks/secrets), with the same keys as on Kind.
#   `npm run k8s:render` shows everything this overlay produces.
# ═══════════════════════════════════════════════════════════════
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: splitx

resources:
  - ../../base

components:
  - ../../components/redis

images:
  - name: splitx
    # The public package GitHub Actions publishes and signs. Jenkins replaces
    # this with the digest of the release it is deploying (D-055), and so does
    # cluster-up on EKS; the tag here is a real release that exists, never a
    # moving tag, which would make a rollback meaningless (D-059).
    newName: ghcr.io/sayandip-jana-1018/splitx
    newTag: 52137218e1d4

patches:
  - path: patches/namespace.yaml
  - path: patches/ingress.yaml
  - path: patches/ingress-internal.yaml
  - path: patches/deployment.yaml
  - path: patches/networkpolicy.yaml

configMapGenerator:
  - name: splitx-config
    behavior: merge
    literals:
      # CloudFront -> ALB -> pod: the visitor's address is second from the right
      # of X-Forwarded-For. Getting this wrong would rate-limit the ALB instead
      # of the visitor, or let a visitor forge an address and dodge the limit.
      - TRUSTED_PROXY_HOPS=2
      # The edge's address (terraform/edge), the one place it is written down:
      # the app builds its links from it, and cluster-up checks it against the
      # distribution Terraform manages before anything is installed.
      - NEXTAUTH_URL=https://REPLACE_WITH_PUBLIC_HOSTNAME
