apiVersion: apps/v1
kind: Deployment
metadata:
  name: splitx
spec:
  template:
    spec:
      # 20 s of preStop, then up to 25 s to finish what is in flight.
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        # Across availability zones first — losing one AZ must not take the
        # service with it — and then across nodes inside a zone.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: splitx
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: splitx
      containers:
        - name: splitx
          # ghcr.io is a remote registry: a digest not on the node is pulled
          # once, then reused.
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              # An ALB learns a pod is leaving later than ingress-nginx does:
              # the controller deregisters it, then the ALB's nodes stop
              # sending to it, which takes seconds. The pod keeps serving
              # through that, and only then shuts down (5 s on Kind).
              sleep:
                seconds: 20
