apiVersion: v1
kind: ServiceAccount
metadata:
  name: splitx
  annotations:
    # IAM Roles for Service Accounts: the pod gets short-lived AWS credentials
    # from the EKS OIDC provider instead of a stored access key (phase 7).
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/splitx-app
