apiVersion: v1
kind: ConfigMap
metadata:
  name: splitx-config
data:
  # CloudFront -> ALB -> pod: the client address is two entries from the right
  # of X-Forwarded-For. Getting this wrong would rate-limit the ALB instead of
  # the visitor, or let a visitor forge an address and dodge the limit.
  TRUSTED_PROXY_HOPS: "2"
  NEXTAUTH_URL: "https://REPLACE_WITH_PUBLIC_HOSTNAME"
