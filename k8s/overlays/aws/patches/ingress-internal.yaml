apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: splitx-internal
  annotations:
    # Same load balancer as the public Ingress, so this rule is evaluated on
    # the ALB that actually serves traffic.
    # An ALB ignores nginx annotations, so the local one is removed rather
    # than left behind to suggest a protection that is not in force here.
    nginx.ingress.kubernetes.io/whitelist-source-range: null
    alb.ingress.kubernetes.io/group.name: splitx
    # First: these refusals must be evaluated before the application's
    # catch-all "/" (group.order 100 in patches/ingress.yaml).
    alb.ingress.kubernetes.io/group.order: "10"
    # nginx's source-range annotation means nothing to an ALB. The equivalent
    # is a listener rule that answers by itself and never reaches a pod. The
    # edge refuses these paths too (terraform/edge's function): this is the
    # second lock, as nginx's rule is on Kind.
    alb.ingress.kubernetes.io/actions.deny-internal: >-
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"403","messageBody":"Not available"}}
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/metrics
            pathType: Exact
            backend:
              service:
                name: deny-internal
                port:
                  name: use-annotation
          - path: /api/health/ready
            pathType: Exact
            backend:
              service:
                name: deny-internal
                port:
                  name: use-annotation
