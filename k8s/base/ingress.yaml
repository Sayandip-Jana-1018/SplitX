apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: splitx-ingress
  namespace: splitx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: splitx-service
                port:
                  number: 80
