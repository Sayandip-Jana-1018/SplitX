apiVersion: apps/v1
kind: Deployment
metadata:
  name: splitx
  labels:
    app.kubernetes.io/name: splitx
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: splitx
spec:
  # A starting point only: the HorizontalPodAutoscaler owns this field once it
  # is running, and the overlays leave it alone so `kubectl apply` cannot undo
  # a scale-up decision the autoscaler has already made.
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: splitx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the current count during a release: add one new pod,
      # wait for it to pass readiness, then retire an old one.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: splitx
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: splitx
    spec:
      serviceAccountName: splitx
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas over the worker nodes so losing one node cannot take
      # every pod with it. ScheduleAnyway, not DoNotSchedule: during a scale-up
      # past the node count, and while a node is away, running somewhere beats
      # staying Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: splitx
      # The constraint above is one score among several, and it lost: once
      # Jenkins took 768Mi on one worker, the scheduler put both replicas on
      # the emptier one, twice in a row (D-058). This says the same thing with
      # the heaviest weight a preference can carry, and still yields when there
      # is nowhere else to go.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: splitx
      containers:
        - name: splitx
          image: splitx:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: splitx-config
            - secretRef:
                name: splitx-secrets
          env:
            # The logger stamps every line with the pod that produced it, so a
            # request ID in Loki leads back to one pod and one node.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          resources:
            # The request is what the autoscaler measures against and what the
            # scheduler reserves. There is no CPU limit, on measurement (D-053):
            # Node runs JavaScript on one thread, so a limit cannot stop one
            # plan taking a node; what a 1-CPU quota did was make V8's compiler
            # and garbage-collection threads share that core with the main
            # thread. Fresh pods under overload stalled for up to 21 s, and two
            # pods served 45% fewer plans than they do without it. Memory keeps
            # a limit, because running out of it is not a slowdown.
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          # A cold Node process gets up to 60 s to answer before liveness starts.
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 2
            # The kubelet default of 1 s is shorter than a first request to a
            # cold Next.js route can take.
            timeoutSeconds: 3
            failureThreshold: 30
          # Liveness never touches the database: a database outage must not
          # restart every pod in the deployment. It must not restart a pod that
          # is merely busy either. This endpoint waits on the same event loop as
          # the work, so an overloaded pod answers it slowly, not never — and
          # with a 3 s timeout and 3 failures, healthy containers were restarted
          # under measured overload, killing every request they were serving
          # (docs/evidence/load-tests.md). A hung process still fails every
          # check and is restarted in about two minutes; readiness has taken it
          # out of the Service long before then.
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          # Readiness pings the database and takes the pod out of the Service
          # until it answers again. It never restarts anything.
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Endpoint removal and SIGTERM race each other. Sleeping first
              # lets ingress-nginx stop sending traffic before the server
              # starts shutting down, which is what makes a release lossless.
              sleep:
                seconds: 5
      volumes:
        # The root filesystem is read-only; these are the only writable paths.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
