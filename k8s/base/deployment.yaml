apiVersion: apps/v1
kind: Deployment
metadata:
  name: splitx
  namespace: splitx
  labels:
    app: splitx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: splitx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: splitx
    spec:
      containers:
        - name: splitx
          image: splitx-app:latest    # Replace with ECR URL in production
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: splitx-config
            - secretRef:
                name: splitx-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Startup gives a cold Node process up to 60s before liveness applies.
          startupProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            periodSeconds: 2
            failureThreshold: 30
          # Liveness never touches the database: a DB outage must not restart every pod.
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness pings the database and takes the pod out of the Service until it recovers.
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
