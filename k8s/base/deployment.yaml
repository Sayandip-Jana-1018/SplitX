apiVersion: apps/v1
kind: Deployment
metadata:
  name: splitx
  namespace: splitx
  labels:
    app: splitx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: splitx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: splitx
    spec:
      containers:
        - name: splitx
          image: splitx-app:latest    # Replace with ECR URL in production
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: splitx-config
            - secretRef:
                name: splitx-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Kubernetes probes hitting the existing /api/health endpoint
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
