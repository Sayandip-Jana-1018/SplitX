# ═══════════════════════════════════════════════════════════════
#   SplitX — the keys of the splitx-secrets Secret. Not applied by
#   kustomize, and never holding a real value.
#
#   scripts/cluster-up.mjs builds the Secret from your local .env and
#   pipes it into `kubectl apply -f -`; the values never reach a file,
#   a command line or the shell history. To do it by hand instead:
#
#     kubectl create secret generic splitx-secrets -n splitx \
#       --from-env-file=<a file holding only the keys below>
#
#   On EKS this Secret is created the same way from Jenkins credentials
#   (phase 6); the manifests only ever reference it by name.
# ═══════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: splitx-secrets
  namespace: splitx
type: Opaque
stringData:
  # Postgres — in-cluster (local overlay) or Neon (aws overlay).
  # connection_limit is set explicitly: ten pods opening Prisma's default pool
  # would exhaust a small database (B-010).
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/splitx?connection_limit=5&pool_timeout=10"
  DIRECT_URL: "postgresql://USER:PASSWORD@HOST:5432/splitx"
  POSTGRES_PASSWORD: "<only used by the in-cluster Postgres component>"
  # Sessions and the rate limiter's identity hashing.
  NEXTAUTH_SECRET: "<openssl rand -base64 32>"
  # Guards /api/metrics.
  METRICS_TOKEN: "<openssl rand -base64 32>"
  # Rate limiting. redis://:PASSWORD@splitx-redis:6379/0 in-cluster.
  REDIS_URL: "<redis connection string>"
  REDIS_PASSWORD: "<only used by the in-cluster Redis component>"
  # Storage and AI. The browser never sees the service role key.
  NEXT_PUBLIC_SUPABASE_URL: "https://<project>.supabase.co"
  SUPABASE_SERVICE_ROLE_KEY: "<supabase secret key>"
  GEMINI_API_KEY: "<google ai studio key>"
  # OAuth sign-in, optional locally.
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GITHUB_ID: ""
  GITHUB_SECRET: ""
  RESEND_API_KEY: ""
  EMAIL_FROM: ""
