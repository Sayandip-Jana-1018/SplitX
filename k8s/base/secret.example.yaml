# ═══════════════════════════════════════════════════════════════
#   SplitX — Secret TEMPLATE (never apply this file as-is)
#
#   Real values never go in git. Create the Secret from your shell:
#
#     kubectl create secret generic splitx-secrets -n splitx \
#       --from-literal=DATABASE_URL='postgresql://USER:PASSWORD@HOST:5432/splitx?sslmode=require' \
#       --from-literal=DIRECT_URL='postgresql://USER:PASSWORD@HOST:5432/splitx?sslmode=require' \
#       --from-literal=NEXTAUTH_SECRET="$(openssl rand -base64 32)" \
#       --from-literal=NEXTAUTH_URL='https://your-domain' \
#       --from-literal=METRICS_TOKEN="$(openssl rand -base64 32)" \
#       --from-literal=GEMINI_API_KEY='...' \
#       --from-literal=UPSTASH_REDIS_REST_URL='...' \
#       --from-literal=UPSTASH_REDIS_REST_TOKEN='...'
#
#   This file documents the expected keys only.
# ═══════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: splitx-secrets
  namespace: splitx
type: Opaque
stringData:
  DATABASE_URL: "<set-at-deploy-time>"
  DIRECT_URL: "<set-at-deploy-time>"
  NEXTAUTH_SECRET: "<set-at-deploy-time>"
  NEXTAUTH_URL: "<set-at-deploy-time>"
  METRICS_TOKEN: "<set-at-deploy-time>"
  GEMINI_API_KEY: "<set-at-deploy-time>"
  UPSTASH_REDIS_REST_URL: "<set-at-deploy-time>"
  UPSTASH_REDIS_REST_TOKEN: "<set-at-deploy-time>"
