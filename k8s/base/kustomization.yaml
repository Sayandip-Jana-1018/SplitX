apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything below lands in the splitx namespace. Overlays choose the image,
# the hostname and which components (in-cluster Postgres, Redis) come along.
namespace: splitx

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - ingress-internal.yaml
