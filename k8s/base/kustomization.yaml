apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything below lands in the splitx namespace. Overlays choose the image,
# the hostname and which components (in-cluster Postgres, Redis) come along.
namespace: splitx

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - ingress-internal.yaml
  # Monitoring: needs the Prometheus Operator CRDs (kube-prometheus-stack).
  - servicemonitor.yaml
  - prometheusrule.yaml

configMapGenerator:
  # Hashed name: a change to config.env becomes a new ConfigMap and a rollout,
  # instead of an edit the running pods never see.
  - name: splitx-config
    envs:
      - config.env
    options:
      labels:
        app.kubernetes.io/name: splitx
        app.kubernetes.io/part-of: splitx
