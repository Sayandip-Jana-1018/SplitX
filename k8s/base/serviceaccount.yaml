apiVersion: v1
kind: ServiceAccount
metadata:
  name: splitx
  labels:
    app.kubernetes.io/name: splitx
    app.kubernetes.io/part-of: splitx
# The app never calls the Kubernetes API, so its pods mount no token. It
# never calls AWS either, so on EKS it has no Pod Identity role (D-093).
automountServiceAccountToken: false
