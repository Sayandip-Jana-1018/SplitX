apiVersion: v1
kind: ConfigMap
metadata:
  name: splitx-config
  labels:
    app.kubernetes.io/name: splitx
    app.kubernetes.io/part-of: splitx
data:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "3000"
  # Next's standalone server binds to HOSTNAME. Without 0.0.0.0 it listens on
  # localhost inside the container and every probe and Service request fails.
  HOSTNAME: "0.0.0.0"
  LOG_LEVEL: "info"
  # Only used to build invite and password-reset links: NextAuth itself trusts
  # the forwarded host. The AWS overlay replaces it with the public hostname.
  NEXTAUTH_URL: "http://localhost"
  # One proxy in front of the pod (ingress-nginx), so the client address is the
  # last-but-one entry in X-Forwarded-For. CloudFront -> ALB would be 2.
  TRUSTED_PROXY_HOPS: "1"
  # Shed a settlement preview that has already waited a second in the queue.
  PREVIEW_MAX_QUEUE_MS: "1000"
  # Secrets (DATABASE_URL, NEXTAUTH_SECRET, METRICS_TOKEN, REDIS_URL, ...) come
  # from the splitx-secrets Secret, which is created from .env at deploy time.
