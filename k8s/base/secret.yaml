# Template — replace values with actual secrets before applying
# In production, use Sealed Secrets or AWS Secrets Manager
apiVersion: v1
kind: Secret
metadata:
  name: splitx-secrets
  namespace: splitx
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@host:5432/splitx"
  DIRECT_URL: "postgresql://user:password@host:5432/splitx"
  NEXTAUTH_SECRET: "your-nextauth-secret-here"
  NEXTAUTH_URL: "https://your-domain.com"
  GEMINI_API_KEY: "your-gemini-key"
  UPSTASH_REDIS_REST_URL: "your-upstash-url"
  UPSTASH_REDIS_REST_TOKEN: "your-upstash-token"
