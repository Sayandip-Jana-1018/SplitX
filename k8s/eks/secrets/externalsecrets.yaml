# ═══════════════════════════════════════════════════════════════
#   The EKS platform's Secrets, made from Secrets Manager (D-093).
#
#   Each has the same name and the same keys as the Secret `npm run k8s:up`
#   builds from .env on Kind (scripts/cluster-up.mjs), so the charts and the
#   application read them unchanged on both clusters. What goes into
#   splitx/demo/app and splitx/demo/platform is decided in
#   scripts/lib/demo-secrets.mjs; every property named below is always there.
#
#   Refreshed every 15 minutes: a value changed with `npm run aws:secrets`
#   during an AWS day reaches the Secret, and a restart of what reads it
#   (pods read environment variables once) puts it to use.
# ═══════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: splitx-secrets
  namespace: splitx
  labels:
    app.kubernetes.io/part-of: splitx
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: splitx-demo
  target:
    name: splitx-secrets
    creationPolicy: Owner
  # Every key of the app's secret: DATABASE_URL (the Neon demo branch),
  # REDIS_URL (the cluster's own Redis), NEXTAUTH_SECRET, METRICS_TOKEN,
  # ORIGIN_VERIFY_SECRET and the optional services that are configured.
  dataFrom:
    - extract:
        key: splitx/demo/app
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: splitx
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: splitx-demo
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: splitx/demo/platform
        property: GF_ADMIN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-splitx
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: splitx
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: splitx-demo
  target:
    name: alertmanager-splitx
    creationPolicy: Owner
  # The whole configuration, filled from .env by aws:secrets exactly as k8s:up
  # fills it on Kind (scripts/lib/alertmanager-config.mjs).
  data:
    - secretKey: alertmanager.yaml
      remoteRef:
        key: splitx/demo/platform
        property: ALERTMANAGER_YAML
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-admin
  namespace: jenkins
  labels:
    app.kubernetes.io/part-of: splitx
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: splitx-demo
  target:
    name: jenkins-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        jenkins-admin-user: admin
        jenkins-admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: splitx/demo/platform
        property: JENKINS_ADMIN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-secrets
  namespace: jenkins
  labels:
    app.kubernetes.io/part-of: splitx
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: splitx-demo
  target:
    name: jenkins-secrets
    creationPolicy: Owner
  # Every key becomes a JCasC variable (helm/platform/jenkins.values.yaml).
  data:
    - secretKey: webhook-secret
      remoteRef:
        key: splitx/demo/platform
        property: GITHUB_WEBHOOK_SECRET
    - secretKey: trigger-token
      remoteRef:
        key: splitx/demo/platform
        property: JENKINS_TRIGGER_TOKEN
    # Empty when .env has no JENKINS_GITHUB_TOKEN: Jenkins then deploys but
    # reports nothing back to GitHub (B-026).
    - secretKey: github-token
      remoteRef:
        key: splitx/demo/platform
        property: JENKINS_GITHUB_TOKEN
    # Jenkins' Nexus account, which may only read and add evidence (D-096).
    - secretKey: nexus-password
      remoteRef:
        key: splitx/demo/platform
        property: NEXUS_JENKINS_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-admin
  namespace: nexus
  labels:
    app.kubernetes.io/part-of: splitx
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: splitx-demo
  target:
    name: nexus-admin
    creationPolicy: Owner
  # The admin password Nexus starts with, and the password its setup Job
  # gives Jenkins' account (nexus/provision.mjs).
  data:
    - secretKey: password
      remoteRef:
        key: splitx/demo/platform
        property: NEXUS_ADMIN_PASSWORD
    - secretKey: jenkins-password
      remoteRef:
        key: splitx/demo/platform
        property: NEXUS_JENKINS_PASSWORD
