# ═══════════════════════════════════════════════════════════════
#   Where the EKS platform's secrets come from (D-093): AWS Secrets Manager,
#   read by the External Secrets Operator with its own Pod Identity role
#   (splitx-wl-external-secrets), which can read splitx/demo/* and nothing
#   else. `npm run aws:secrets` writes those secrets from .env before an AWS
#   day; aws-down deletes them that evening.
#
#   No `auth:` block: the operator uses its pod's credentials, which EKS Pod
#   Identity supplies. No key is stored in the cluster.
# ═══════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: splitx-demo
  labels:
    app.kubernetes.io/part-of: splitx
spec:
  provider:
    aws:
      service: SecretsManager
      # The platform's region (terraform/platform); cluster-up refuses to run
      # if the two ever differ.
      region: ap-south-1
  # Only the namespaces that hold one of the ExternalSecrets beside this file
  # may use the store.
  conditions:
    - namespaces:
        - splitx
        - monitoring
        - jenkins
