# ═══════════════════════════════════════════════════════════════
#   The EKS platform's Secrets (D-093), applied by
#   `node scripts/cluster-up.mjs --target eks` right after the External
#   Secrets Operator's chart and before every chart that reads them. Kept out
#   of k8s/eks, which aws-up applies before the operator's CRDs exist.
# ═══════════════════════════════════════════════════════════════
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - clustersecretstore.yaml
  - externalsecrets.yaml
