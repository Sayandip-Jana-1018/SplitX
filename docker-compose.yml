# ═══════════════════════════════════════════════════════════════
#   SplitIT — the two services local development needs
#   Run: docker compose up -d postgres redis
#
#   Required in .env: POSTGRES_PASSWORD, REDIS_PASSWORD (see .env.example).
#   The app itself runs with `npm run dev`; production is Vercel, Neon and
#   Upstash. Postgres 17 and Redis 7.4, as CI tests against.
#   Both bind to 127.0.0.1 only, on host ports 5433/6380 so they can't be
#   shadowed by a native Postgres/Redis already listening on 5432/6379.
# ═══════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL (Local Development DB) ──
  postgres:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: splitx-postgres
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      POSTGRES_USER: splitx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: splitx
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitx"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis (rate limiting) ──
  # Limiter counters are ephemeral by design: no persistence, bounded memory,
  # least-recently-used keys evicted first. A restart only resets the windows.
  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: splitx-redis
    deploy:
      resources:
        limits:
          memory: 192m
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
