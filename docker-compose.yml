# ═══════════════════════════════════════════════════════════════
#   SplitX — Full Development Stack
#   Run: docker compose --profile ci up -d
#   App only: docker compose up -d
#
#   Required in .env: POSTGRES_PASSWORD, REDIS_PASSWORD, METRICS_TOKEN (see .env.example).
#   Monitoring (Prometheus, Grafana, Loki) runs in the Kubernetes cluster, not
#   here: `npm run k8s:up`, then http://grafana.localhost (D-052).
#   Images are pinned by digest, and every service has a memory limit so the
#   whole stack fits the 10 GB Docker VM. Build the app image with provenance
#   using `npm run image:build`; Compose then just runs `splitx:local`.
#   Every port except the app binds to 127.0.0.1 — admin UIs with known
#   defaults must not be reachable from a shared network (e.g. campus wifi).
#   Postgres/Redis use host ports 5433/6380 so they can't be shadowed by a
#   native Postgres/Redis already listening on 5432/6379.
# ═══════════════════════════════════════════════════════════════

services:

  # ── SplitX Application ──
  splitx:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Filled in by `npm run image:build` (git commit, version, build time);
        # a plain `docker compose build` leaves them unknown.
        GIT_SHA: ${GIT_SHA:-unknown}
        APP_VERSION: ${APP_VERSION:-dev}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: splitx:local
    container_name: splitx-app
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_URL: "http://localhost:3000"
      DATABASE_URL: "postgresql://splitx:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/splitx"
      DIRECT_URL: "postgresql://splitx:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/splitx"
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env}
      # Rate limiting uses the compose Redis over TCP (takes precedence over Upstash).
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0"
      # Nothing sits in front of the container locally, so no forwarded address is trustworthy.
      TRUSTED_PROXY_HOPS: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - splitx-network

  # ── PostgreSQL (Local Development DB) ──
  postgres:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: splitx-postgres
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      POSTGRES_USER: splitx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: splitx
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitx"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - splitx-network

  # ── Redis (rate limiting) ──
  # Limiter counters are ephemeral by design: no persistence, bounded memory,
  # least-recently-used keys evicted first. A restart only resets the windows.
  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: splitx-redis
    deploy:
      resources:
        limits:
          memory: 192m
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - splitx-network

  # ── Jenkins (CI/CD Pipeline) ──
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile.jenkins
    container_name: splitx-jenkins
    deploy:
      resources:
        limits:
          memory: 2g
    profiles: ["ci"]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: "-Djava.awt.headless=true -Xmx512m"
    restart: unless-stopped
    networks:
      - splitx-network

  # ── SonarQube (Code Quality Analysis) ──
  sonarqube:
    image: sonarqube:10.7.0-community
    container_name: splitx-sonarqube
    deploy:
      resources:
        limits:
          memory: 3g
    profiles: ["ci"]
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped
    networks:
      - splitx-network

  # ── Nexus (Artifact Repository) ──
  nexus:
    image: sonatype/nexus3:3.92.0
    container_name: splitx-nexus
    deploy:
      resources:
        limits:
          memory: 2g
    profiles: ["ci"]
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
    volumes:
      - nexus_data:/nexus-data
    restart: unless-stopped
    networks:
      - splitx-network

volumes:
  postgres_data:
  jenkins_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  nexus_data:

networks:
  splitx-network:
    driver: bridge
