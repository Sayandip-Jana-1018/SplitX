# ═══════════════════════════════════════════════════════════════
#   SplitX — Full Development Stack
#   Run: docker compose --profile monitoring --profile ci up -d
#   App only: docker compose up -d
#
#   Required in .env: POSTGRES_PASSWORD, REDIS_PASSWORD, METRICS_TOKEN, GF_ADMIN_PASSWORD (see .env.example).
#   Every port except the app binds to 127.0.0.1 — admin UIs with known
#   defaults must not be reachable from a shared network (e.g. campus wifi).
#   Postgres/Redis use host ports 5433/6380 so they can't be shadowed by a
#   native Postgres/Redis already listening on 5432/6379.
# ═══════════════════════════════════════════════════════════════

services:

  # ── SplitX Application ──
  splitx:
    build:
      context: .
      dockerfile: Dockerfile
    image: splitx:local
    container_name: splitx-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_URL: "http://localhost:3000"
      DATABASE_URL: "postgresql://splitx:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/splitx"
      DIRECT_URL: "postgresql://splitx:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/splitx"
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env}
      # Rate limiting uses the compose Redis over TCP (takes precedence over Upstash).
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0"
      # Nothing sits in front of the container locally, so no forwarded address is trustworthy.
      TRUSTED_PROXY_HOPS: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - splitx-network

  # ── PostgreSQL (Local Development DB) ──
  postgres:
    image: postgres:16-alpine
    container_name: splitx-postgres
    environment:
      POSTGRES_USER: splitx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: splitx
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitx"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - splitx-network

  # ── Redis (rate limiting) ──
  # Limiter counters are ephemeral by design: no persistence, bounded memory,
  # least-recently-used keys evicted first. A restart only resets the windows.
  redis:
    image: redis:7.4.9-alpine
    container_name: splitx-redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - splitx-network

  # ── Prometheus (Metrics Collection) ──
  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: splitx-prometheus
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_token
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    depends_on:
      splitx:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - splitx-network

  # ── Grafana (Dashboards & Visualization) ──
  grafana:
    image: grafana/grafana:11.6.1
    container_name: splitx-grafana
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?Set GF_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "lokiLogsDataplane"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - splitx-network

  # ── Loki (Log Aggregation Database) ──
  loki:
    image: grafana/loki:3.4.2
    container_name: splitx-loki
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - splitx-network

  # ── Promtail (Log Collector Agent) ──
  promtail:
    image: grafana/promtail:3.4.2
    container_name: splitx-promtail
    profiles: ["monitoring"]
    user: root
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - splitx-network

  # ── Jenkins (CI/CD Pipeline) ──
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile.jenkins
    container_name: splitx-jenkins
    profiles: ["ci"]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: "-Djava.awt.headless=true -Xmx512m"
    restart: unless-stopped
    networks:
      - splitx-network

  # ── SonarQube (Code Quality Analysis) ──
  sonarqube:
    image: sonarqube:10.7.0-community
    container_name: splitx-sonarqube
    profiles: ["ci"]
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped
    networks:
      - splitx-network

  # ── Nexus (Artifact Repository) ──
  nexus:
    image: sonatype/nexus3:3.92.0
    container_name: splitx-nexus
    profiles: ["ci"]
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
    volumes:
      - nexus_data:/nexus-data
    restart: unless-stopped
    networks:
      - splitx-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  jenkins_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  nexus_data:

networks:
  splitx-network:
    driver: bridge

secrets:
  # Handed to Prometheus as a file so the scrape token never appears in prometheus.yml.
  metrics_token:
    environment: METRICS_TOKEN
