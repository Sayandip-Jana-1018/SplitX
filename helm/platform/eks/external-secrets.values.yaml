# ═══════════════════════════════════════════════════════════════
#   External Secrets Operator on EKS (D-093).
#
#   It reads splitx/demo/app and splitx/demo/platform from AWS Secrets
#   Manager (written from .env by `npm run aws:secrets`) and makes the same
#   Kubernetes Secrets `npm run k8s:up` builds on Kind: the ExternalSecrets
#   are in k8s/eks/secrets. It gets AWS credentials through EKS Pod Identity
#   (terraform/platform/workloads.tf binds splitx-wl-external-secrets to the
#   service account below), and that role can read splitx/demo/* and nothing
#   else. No key is stored anywhere.
# ═══════════════════════════════════════════════════════════════

# The name the Pod Identity association in terraform/platform/workloads.tf expects.
serviceAccount:
  create: true
  name: external-secrets

# ClusterSecretStore, yes: one store for the namespaces that need secrets.
# Nothing here pushes secrets back to AWS or copies them between namespaces,
# so those controllers stay off (and so does the RBAC they would need).
processClusterStore: true
processPushSecret: false
processClusterExternalSecret: false

# A handful of Secrets, refreshed every 15 minutes: one replica of each is plenty.
replicaCount: 1
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

webhook:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi

certController:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 192Mi

# Installed before kube-prometheus-stack (its Secrets come from here), so the
# ServiceMonitor CRD does not exist yet.
serviceMonitor:
  enabled: false
