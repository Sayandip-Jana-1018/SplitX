# ═══════════════════════════════════════════════════════════════
#   Namespaces for the platform charts, created with their Pod Security
#   level before any chart installs into them. `helm --create-namespace`
#   would create them unlabelled, which Kubernetes treats as privileged.
# ═══════════════════════════════════════════════════════════════
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # Prometheus, Alertmanager, Grafana, Loki and Alloy all run as non-root
    # with no host access, so they get the same level as the application.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: node-exporter
  labels:
    # node-exporter reads the node's /proc and /sys through host paths, in the
    # host's network and PID namespaces. Only a privileged namespace allows
    # that, so it gets one of its own instead of loosening `monitoring`.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
  labels:
    # The Jenkins controller, its build agents and the webhook relay. Jenkins
    # builds no images (D-054), so nothing here needs root or host access, and
    # an agent pod that asked for it would be refused.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    # The policy engine runs as a non-root web server with no host access.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: nexus
  labels:
    # Nexus (D-096) runs as its image's nexus user with a read-only root
    # filesystem, and its setup Job as a plain Node process.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
