# ═══════════════════════════════════════════════════════════════
#   Jenkins: deploys signed releases to this cluster (D-055).
#
#   GitHub Actions builds, scans and signs every release on main and
#   announces it as a GitHub deployment (D-054). GitHub's "deployment"
#   webhook reaches Jenkins through the relay in jenkins/relay (D-056),
#   and the job splitx-deploy runs jenkins/Jenkinsfile: verify, deploy,
#   check, and roll back if the release does not come up healthy.
#
#   Nothing here is configured by clicking. Plugins are pinned, the
#   configuration is the JCasC below, the job is defined with Job DSL, and
#   credentials come from Secrets that `npm run k8s:up` builds from .env.
# ═══════════════════════════════════════════════════════════════
fullnameOverride: jenkins

controller:
  # Builds run in agent pods, never on the controller.
  numExecutors: 0
  jenkinsUrl: http://jenkins.localhost/

  admin:
    # Keys jenkins-admin-user and jenkins-admin-password, from .env (B-006).
    existingSecret: jenkins-admin
    # Despite its name, this is what mounts the admin Secret for JCasC; with
    # existingSecret set the chart creates no Secret of its own. At false the
    # admin user was configured with unresolved variables and nobody could
    # log in.
    createSecret: true
  # Every key of this Secret becomes a JCasC variable: ${webhook-secret},
  # ${trigger-token}, ${github-token}.
  existingSecret: jenkins-secrets

  # Where this Jenkins deploys, handed to every build (JCasC below). The same
  # Jenkinsfile deploys to EKS with the aws overlay and its public address.
  containerEnv:
    # The GitHub environment whose deployments this Jenkins takes.
    - name: DEPLOY_ENVIRONMENT
      value: kind
    - name: DEPLOY_OVERLAY
      value: k8s/overlays/local
    # Where the smoke test reaches the site the way users do: the ingress
    # controller, asked for the host the Ingress serves.
    - name: DEPLOY_EDGE_URL
      value: http://ingress-nginx-controller.ingress-nginx.svc.cluster.local
    - name: DEPLOY_EDGE_HOST
      value: localhost
    # The branch the job reads its Jenkinsfile and steps from. A pipeline change
    # can be rehearsed from its branch before it is merged; releases are only
    # ever signed on main, so this cannot widen what gets deployed.
    - name: DEPLOY_PIPELINE_BRANCH
      value: main

  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    # No CPU limit (null removes the chart's): throttling the JVM's compiler
    # and GC threads is what stalled fresh application pods (D-053).
    limits:
      cpu: null
      memory: 1536Mi
  javaOpts: -XX:MaxRAMPercentage=60

  podSecurityContextOverride:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  sidecars:
    configAutoReload:
      containerSecurityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

  # Agents connect over WebSocket on the HTTP port, so no second port is open.
  agentListenerEnabled: false

  # The chart's init container ends by copying the plugins it installed into
  # the volume the controller reads, with `yes n | cp -i`, which exits 1 when
  # those files are already there. Its script runs under `set -e`, so the
  # second start of the same pod failed — and a Docker restart restarts
  # containers in place, so Jenkins never came back after one (D-055).
  # Clearing that volume first makes every start copy the pinned set again.
  customInitContainers:
    - name: clear-plugin-volume
      image: node:24.21.0-alpine3.24@sha256:be80f76cf40ec8e42b9bec49f60a55e0660f30af58d3e5a25530785b30ea67e2
      command: ["sh", "-c", "rm -rf /var/jenkins_plugins/* /var/jenkins_plugins/.[!.]*; exit 0"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: plugin-dir
          mountPath: /var/jenkins_plugins

  # Every plugin at an exact version, dependencies included, so every install
  # is the same install. Resolving dependencies at start picked the lowest
  # versions they allow, and those did not fit together: JUnit, and with it
  # the Prometheus plugin, failed to load (D-055). This list is what resolved
  # for Jenkins 2.568.3 on 2026-09-18, with all 81 loaded and active; nothing
  # is downloaded that is not named here.
  installLatestPlugins: false
  installLatestSpecifiedPlugins: false
  installPlugins:
    # Chosen:
    - kubernetes:4557.ve746270f672f
    - workflow-aggregator:608.v67378e9d3db_1
    - git:5.10.1
    - configuration-as-code:2121.v86fe99d4b_b_a_b_
    - job-dsl:3732.v9a_c49a_61a_313
    - generic-webhook-trigger:2.4.3
    - prometheus:860.v532442b_44e9a_
    - pipeline-graph-view:1013.v9f83fd83c063
    # What they need:
    - antisamy-markup-formatter:173.v680e3a_b_69ff3
    - apache-httpcomponents-client-4-api:4.5.14-269.vfa_2321039a_83
    - asm-api:9.10.1-216.va_9256d3b_844b_
    - authentication-tokens:1.144.v5ff4a_5ec5c33
    - bootstrap5-api:5.3.8-1048.va_c299057e35c
    - bouncycastle-api:2.30.1.85.2-304.v4b_5b_62e59a_a_7
