  # Jenkins' own metrics at /prometheus, scraped like everything else.
  prometheus:
    enabled: true

  ingress:
    enabled: true
    ingressClassName: nginx
    hostName: jenkins.localhost

  # The chart's `helm test` pod runs as root and would be refused by the
  # namespace; k8s:verify and delivery-verify test this Jenkins instead.
  testEnabled: false

  JCasC:
    configScripts:
      splitx: |
        jenkins:
          systemMessage: >-
            SplitX delivery. Deploys releases that GitHub Actions signed on main,
            when GitHub announces them. Configured as code in
            helm/platform/jenkins.values.yaml; nothing here is set by hand.
          globalNodeProperties:
            - envVars:
                env:
                  - key: DEPLOY_ENVIRONMENT
                    value: "${DEPLOY_ENVIRONMENT}"
                  - key: DEPLOY_OVERLAY
                    value: "${DEPLOY_OVERLAY}"
                  - key: DEPLOY_EDGE_URL
                    value: "${DEPLOY_EDGE_URL}"
                  - key: DEPLOY_EDGE_HOST
                    value: "${DEPLOY_EDGE_HOST}"

        credentials:
          system:
            domainCredentials:
              - credentials:
                  - string:
                      id: github-webhook-secret
                      description: The secret GitHub signs every webhook delivery with
                      secret: "${webhook-secret}"
                  - string:
                      id: webhook-trigger-token
                      description: The token the relay presents to the webhook endpoint
                      secret: "${trigger-token}"
                  - string:
                      id: github-deployments-token
                      description: Reports deployment statuses to GitHub; empty means not reported
                      secret: "${github-token}"

        unclassified:
          # Generic Webhook Trigger: a delivery without a valid GitHub signature
          # is refused with HTTP 403 before any job sees it.
          whitelist:
            enabled: true
            whitelistItems:
              - host: ""
                hmacEnabled: true
                hmacHeader: X-Hub-Signature-256
                hmacCredentialId: github-webhook-secret
                hmacAlgorithm: HmacSHA256

        jobs:
          - script: |
              pipelineJob('splitx-deploy') {
                displayName('SplitX: deploy a signed release')
                description('Deploys the release a GitHub deployment names, once its webhook and its image are verified, and rolls it back if it does not come up healthy (D-055). Steps: jenkins/Jenkinsfile.')
                logRotator { numToKeep(100) }
                parameters {
                  stringParam('deployment_id', '', 'GitHub deployment ID')
                  stringParam('deployment_sha', '', 'The commit to deploy')
                  stringParam('deployment_image', '', 'The image, by digest')
                  stringParam('deployment_environment', '', 'The GitHub environment')
                  choiceParam('fault', ['none', 'unready'], 'Rehearsal only: deploy with a fault that keeps new pods unready, to prove the rollback')
                }
                properties {
                  disableConcurrentBuilds { abortPrevious(false) }
                  pipelineTriggers {
                    triggers {
                      genericTrigger {
                        genericVariables {
                          genericVariable { key('action'); value('$.action') }
                          genericVariable { key('deployment_id'); value('$.deployment.id') }
                          genericVariable { key('deployment_sha'); value('$.deployment.sha') }
                          genericVariable { key('deployment_image'); value('$.deployment.payload.image') }
                          genericVariable { key('deployment_environment'); value('$.deployment.environment') }
                        }
                        genericHeaderVariables {
                          genericHeaderVariable { key('X-GitHub-Event'); regexpFilter('') }
                          genericHeaderVariable { key('X-GitHub-Delivery'); regexpFilter('') }
                        }
                        tokenCredentialId('webhook-trigger-token')
                        // Only a new deployment for this cluster's environment starts a build.
                        regexpFilterText('$x_github_event $action $deployment_environment')
                        regexpFilterExpression('^deployment created ${DEPLOY_ENVIRONMENT}$')
                        causeString('GitHub deployment $deployment_id, delivery $x_github_delivery')
                        printContributedVariables(false)
                        printPostContent(false)
                        silentResponse(false)
                      }
                    }
                  }
                }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote { url('https://github.com/Sayandip-Jana-1018/SplitX.git') }
                        branch('*/${DEPLOY_PIPELINE_BRANCH}')
                      }
                    }
                    scriptPath('jenkins/Jenkinsfile')
                    lightweight(true)
                  }
                }
              }

agent:
  enabled: true
  websocket: true
  # The restricted Pod Security level refuses the default agent container
  # without this.
  restrictedPssSecurityContext: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: null
      memory: 512Mi

# The identity deploy builds run as. Its only permissions are in the splitx
# namespace, granted in jenkins/rbac.yaml.
serviceAccountAgent:
  create: true
  name: jenkins-deployer

persistence:
  size: 4Gi

# The chart's policies would allow agents from anywhere; jenkins/networkpolicy.yaml
# names each path instead.
networkPolicy:
  enabled: false
