# ═══════════════════════════════════════════════════════════════
#   SplitX — Grafana Datasources
#   Auto-provisions both Prometheus (metrics) and Loki (logs)
# ═══════════════════════════════════════════════════════════════

apiVersion: 1

datasources:
  # ── Prometheus: Metrics ──
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"

  # ── Loki: Logs ──
  - name: Loki
    type: loki
    uid: P8E80F9AEF21F6940
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
