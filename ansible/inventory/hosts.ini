#   SplitX — Ansible Inventory
#   Replace IPs with actual EC2 instance IPs from Terraform output
# ═══════════════════════════════════════════════════════════════

[k8s_nodes]
# node1 ansible_host=<EC2_PUBLIC_IP_1> ansible_ssh_private_key_file=~/.ssh/splitx-key.pem
# node2 ansible_host=<EC2_PUBLIC_IP_2> ansible_ssh_private_key_file=~/.ssh/splitx-key.pem

[k8s_nodes:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
