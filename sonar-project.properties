# SonarQube Cloud analysis of SplitIT. The organization and project keys come
# from the CI job (repository variables SONAR_ORGANIZATION and
# SONAR_PROJECT_KEY), so they are not repeated here.

sonar.projectName=SplitIT
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**

sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/coverage/**,\
  public/**,\
  prisma/migrations/**

# Coverage is what the unit tests measure (vitest.config.mts): the money logic,
# the API routes and the proxy. Pages and components are exercised in a browser
# by the end-to-end tests instead, so they are not counted as uncovered here.
# The glass renderer and its shaders only run on a GPU, which a unit test in Node doesn't have.
# They are measured on real hardware instead (handoff tools, docs/DECISIONS.md, D-121); the
# rules they follow are in src/lib/glass/governor.ts, palette.ts and styles.ts, which are covered.
sonar.coverage.exclusions=\
  src/lib/glass/engine.ts,\
  src/lib/glass/shaders.ts,\
  src/components/**,\
  src/hooks/**,\
  src/app/**/*.tsx,\
  src/**/*.css

sonar.javascript.lcov.reportPaths=coverage/lcov.info
