# ═══════════════════════════════════════════════════════════════
#   SplitX — SonarQube Project Configuration
# ═══════════════════════════════════════════════════════════════

sonar.projectKey=splitx
sonar.projectName=SplitX
sonar.projectVersion=0.1.0

# Source code location
sonar.sources=src
sonar.tests=tests

# TypeScript/JavaScript configuration
sonar.language=ts
sonar.sourceEncoding=UTF-8

# Exclusions (don't analyze these)
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/coverage/**,\
  **/*.test.*,\
  **/*.spec.*,\
  **/public/**,\
  **/prisma/migrations/**

# Coverage report path (if available)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
