# ═══════════════════════════════════════════════════════════════
#   Vulnerabilities accepted in the ops image (D-097), and only there: the
#   release job's scan gate reads this file for ops-api and the traffic lab,
#   never for the application's image. Each entry names the one file it
#   covers, says why it cannot be exploited here, and expires; on that date
#   the gate refuses the image again unless a fixed release has replaced it.
#   tests/unit/infra/opsApi.test.ts refuses an entry without all four.
# ═══════════════════════════════════════════════════════════════
vulnerabilities:
  - id: CVE-2026-84445
    paths:
      - usr/local/bin/k6
    statement: >-
      gRPC-Go denial of service through malformed RPC requests sent to a gRPC
      server. k6 2.3.0, the newest release (2026-09-21), embeds grpc 1.84.0,
      and no fixed 1.84 release exists yet. The traffic lab's k6 serves no
      gRPC and its one script (ops/lab/preview.js) makes plain HTTP requests
      to SplitX's own edge, so the vulnerable code never runs; the lab also
      accepts connections from ops-api only. Dependabot watches ops/ for a
      k6 release with the fix.
    expired_at: 2026-10-24
  - id: CVE-2026-78667
    paths:
      - usr/local/bin/k6
    statement: >-
      Go net/http denial of service through crafted HTTP Range headers, sent
      to a Go HTTP server that serves content by range. k6 2.3.0, the newest
      release, is built with Go 1.27.1; the fix is in Go 1.27.2 (published
      2026-10-09), and no k6 built with it exists yet. The traffic lab runs
      k6 as an HTTP client only (`k6 run`, ops/lab/server.mjs), and its one
      script requests SplitX's own edge, so no Go server of k6's answers a
      Range request; the lab accepts connections from ops-api only.
    expired_at: 2026-10-24
  - id: CVE-2026-97031
    paths:
      - usr/local/bin/k6
    statement: >-
      Go crypto/tls denial of service through repeated ECH outer extension
      references in a ClientHello, which a TLS server parses. Fixed in Go
      1.27.2 (published 2026-10-09); k6 2.3.0 is built with Go 1.27.1 and no
      newer k6 exists yet. The lab's k6 is a TLS client of SplitX's own edge
      and runs no TLS server, so it never parses a ClientHello.
    expired_at: 2026-10-24
  - id: CVE-2026-78669
    paths:
      - usr/local/bin/k6
    statement: >-
      Go net/http and golang.org/x/net/http2 (GO-2026-6611): a malicious
      HTTP/2 peer that opens many streams and then sends many small SETTINGS
      frames makes the other side spend excessive CPU, a client as well as a
      server. Fixed in Go 1.27.2 and x/net 0.60.0 (published 2026-10-08); k6
      2.3.0, the newest release, is built with Go 1.27.1 and x/net 0.58.0.
      The lab's k6 has one peer, TARGET_URL, SplitX's own edge, set in the
      lab's ConfigMap when the platform is installed; a run can choose only
      its rate and length (ops/lab/limits.mjs), so no other server ever
      answers k6. The most such a peer could do is use CPU in one run, which
      ends within 180 s; the lab accepts connections from ops-api only.
    expired_at: 2026-10-24
