# Dependabot opens weekly update pull requests, grouped so a week brings a
# handful rather than dozens; each runs the full CI (tests, the real database,
# the browser tests) before anyone merges it. Security alerts and their
# fixes come on top of this, as they are published.
version: 2

updates:
  - package-ecosystem: npm
    # The website. The phone app's packages move with its Expo SDK, by hand.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Prisma 7 is a major upgrade with its own migration of the client (B-030).
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      # The types describe the Node the app runs (24, on Vercel and in CI), not the newest
      # one; they move with the runtime, by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Held until the tools that check the code accept them (D-110): eslint-config-next's
      # plugins (react, import, jsx-a11y) go up to ESLint 9, and typescript-eslint accepts
      # TypeScript below 6.1, so ESLint 10 and TypeScript 7 would break linting.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    # The workflows.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    groups:
      compose-images:
        patterns:
          - '*'
    ignore:
      # Local development runs what production and CI run: Postgres 17, as Neon does, and
      # Redis 7.4. Their majors move together, by hand.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
      - dependency-name: redis
        update-types: ['version-update:semver-major']
