# Dependabot opens weekly update pull requests, grouped so a week brings a
# handful rather than dozens; each runs the full CI (tests, the real database,
# the image build and scan) before anyone merges it. Security alerts and their
# fixes come on top of this, as they are published.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Prisma 7 is a major upgrade with its own migration of the client (B-030).
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    # The workflows, and the composite action the aws-* workflows share.
    directories:
      - /
      - /.github/actions/aws-terraform
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    groups:
      base-images:
        patterns:
          - '*'

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    groups:
      compose-images:
        patterns:
          - '*'

  # terraform/edge and terraform/platform: the AWS provider and the
  # terraform-aws-modules versions, lock files included. Each PR runs the
  # terraform job (validate, tflint, Trivy) before anything is applied.
  - package-ecosystem: terraform
    directories:
      - /terraform/edge
      - /terraform/platform
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    groups:
      terraform:
        patterns:
          - '*'
