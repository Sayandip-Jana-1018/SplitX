# Dependabot opens weekly update pull requests, grouped so a week brings a
# handful rather than dozens; each runs the full CI (tests, the real database,
# the image build and scan) before anyone merges it. Security alerts and their
# fixes come on top of this, as they are published.
version: 2

updates:
  - package-ecosystem: npm
    # The app, and ops-api's AWS SDK clients (ops/, D-097).
    directories:
      - /
      - /ops
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Prisma 7 is a major upgrade with its own migration of the client (B-030).
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      # The types describe the Node the app runs (24, in the Dockerfile and CI), not the newest
      # one; they move with the runtime, by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    # The workflows, and the composite action the aws-* workflows share.
    directories:
      - /
      - /.github/actions/aws-terraform
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    # The app's image, and the ops image's Node, Alpine and k6 (ops/Dockerfile).
    directories:
      - /
      - /ops
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    groups:
      base-images:
        patterns:
          - '*'
    ignore:
      # The images run an LTS line of Node. A new major is taken by hand once it is LTS
      # (Node 26: October 2026), with @types/node and CI's node-version.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    groups:
      compose-images:
        patterns:
          - '*'
    ignore:
      # Local development runs what production and the cluster run: Postgres 17, as Neon and
      # CI do, and the cluster's Redis 7.4. Their majors move together, by hand.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
      - dependency-name: redis
        update-types: ['version-update:semver-major']

  # terraform/edge and terraform/platform: the AWS provider and the
  # terraform-aws-modules versions, lock files included. Each PR runs the
  # terraform job (validate, tflint, Trivy) before anything is applied.
  - package-ecosystem: terraform
    directories:
      - /terraform/edge
      - /terraform/platform
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    groups:
      terraform:
        patterns:
          - '*'
