name: CodeQL

# Static analysis, with results in the repository's Security tab (code
# scanning): the app's JavaScript and TypeScript, and these workflows
# themselves (script injection, over-broad tokens). Runs on every push to main,
# on pull requests, and weekly, because new queries find problems in old code.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # Mondays, 08:47 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          # Interpreted languages: CodeQL reads the source, nothing is built.
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - public/tesseract
              - synopsis
              - coverage

      - name: Analyse
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
