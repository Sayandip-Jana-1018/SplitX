name: SplitX CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # postinstall generates the Prisma client from prisma/schema.prisma
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        # The unit suite with coverage (for SonarQube), then the hardening checks
        # `npm test` also runs.
        run: |
          npm run test:coverage
          node tests/production-hardening.test.mjs

      - name: Keep the coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate Docker image
        if: ${{ vars.ENABLE_DOCKER_CI == 'true' }}
        run: docker build -t splitx-ci .

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The integration suite fails instead of skipping when this is missing.
      REDIS_URL: redis://127.0.0.1:6379/15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Rate limiter against real Redis
        run: npm run test:integration

  database:
    # The schema, and the code that depends on it, against a real Postgres of
    # the version production runs (Neon reports 17.11): the migrations build an
    # empty database, schema.prisma has no change without a migration, the
    # cluster's schema.sql builds the very same database, and the database
    # tests pass (constraints, integer bounds, and two people writing at once).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          # A throwaway database on the runner: no password to keep, or to leak.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PG: postgresql://postgres@127.0.0.1:5432

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: One empty database per check
        env:
          POSTGRES: ${{ job.services.postgres.id }}
        run: |
          for db in migrated shadow from_sql splitx_test; do
            docker exec "$POSTGRES" createdb -U postgres "$db"
          done

      - name: The migrations build an empty database
        run: DATABASE_URL="$PG/migrated" DIRECT_URL="$PG/migrated" npx prisma migrate deploy

      - name: Nothing in schema.prisma is missing a migration
        run: |
          if ! DATABASE_URL="$PG/migrated" DIRECT_URL="$PG/migrated" npx prisma migrate diff \
               --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
               --shadow-database-url "$PG/shadow" --exit-code --script > missing.sql; then
            echo "::error::prisma/schema.prisma changes what no migration makes. Add one with: npx prisma migrate dev --name <what_it_does>"
            cat missing.sql
            exit 1
          fi
          cat missing.sql

      - name: The cluster's schema.sql builds the same database, and runs again as a no-op
        shell: bash  # with pipefail: a failed pg_dump must fail the step, not compare as empty
        env:
          POSTGRES: ${{ job.services.postgres.id }}
        run: |
          for run in first second; do
            echo "── $run run ──"
            docker exec -i "$POSTGRES" psql -U postgres -d from_sql -X -q -v ON_ERROR_STOP=1 < k8s/components/postgres/schema.sql
          done
          for db in migrated from_sql; do
            # pg_dump writes a random \restrict key into every dump (PostgreSQL 17.6+).
            docker exec "$POSTGRES" pg_dump -U postgres --schema-only --no-owner --no-privileges "$db" \
              | grep -Ev '^.(un)?restrict [[:alnum:]]+$' > "$db.schema.sql"
            docker exec "$POSTGRES" psql -U postgres -d "$db" -X -tAc \
              "SELECT migration_name, checksum, applied_steps_count FROM _prisma_migrations
               WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY 1" > "$db.migrations.txt"
          done
          grep -q 'CREATE TABLE public."User"' migrated.schema.sql
          diff migrated.schema.sql from_sql.schema.sql
          diff migrated.migrations.txt from_sql.migrations.txt
          echo "schema.sql and prisma migrate deploy built the same schema ($(grep -c '^CREATE TABLE' migrated.schema.sql) tables) and recorded the same migrations:"
          cat from_sql.migrations.txt

      - name: Prisma reads that database as up to date
        run: DATABASE_URL="$PG/from_sql" DIRECT_URL="$PG/from_sql" npx prisma migrate status

      - name: Database tests
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/splitx_test
          DIRECT_URL: postgresql://postgres@127.0.0.1:5432/splitx_test
        run: |
          npx prisma migrate deploy
          npm run test:db

  e2e:
    # The flows a classroom uses, in a phone's browser (Playwright, D-107): an
    # account, a group and its invite link, expenses split equally and by
    # amounts, changed and removed, settling up through each state, removing a
    # member, and a shared phone after sign-out. Against a production build, on
    # a real Postgres and Redis, as production runs. A release waits for it.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: splitx_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/splitx_e2e
      DIRECT_URL: postgresql://postgres@127.0.0.1:5432/splitx_e2e
      # The rate limiter's shared store, as on Vercel (Upstash) and EKS.
      REDIS_URL: redis://127.0.0.1:6379/0
      NEXTAUTH_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: 'true'
      AI_DISABLED: 'true'
      NEXT_TELEMETRY_DISABLED: 1
      E2E_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: A session secret for this run only
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "NEXTAUTH_SECRET=$secret" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Migrate the database
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Serve the build, as production does
        run: |
          nohup npx next start -p 3000 > next.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health/ready > /dev/null && exit 0
            sleep 1
          done
          cat next.log
          exit 1

      - name: The flows
        run: npx playwright test

      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
            next.log
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks

      - name: Scan every commit for secrets
        # Findings in historical commits whose secrets were rotated are listed by
        # fingerprint in .gitleaksignore; anything new fails the build.
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  manifests:
    # Kubernetes manifests are code: they get the same treatment as the rest of
    # it. Nothing here needs a cluster, so it runs on every push in seconds.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # kubeconform, pinned by digest like every other tool this pipeline runs.
      KUBECONFORM: ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
      # The version the Kind cluster and the EKS module both use.
      K8S_VERSION: "1.35.0"
      # JSON schemas for CRDs such as ServiceMonitor and PrometheusRule, pinned
      # to a commit so a change upstream cannot change what passes here.
      CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: The cluster's schema.sql is up to date with prisma/migrations
        # A migration committed without regenerating would reach the cluster as
        # a missing table or column, hours later, as a 500 from one endpoint.
        # (That the migrations match schema.prisma is the database job's check.)
        run: node scripts/db-schema.mjs --check

      - name: Render and validate every overlay, and the platform's own manifests
        # The platform's: Jenkins' permissions, network policy, relay and alerts
        # (jenkins/, and jenkins/eks for EKS), Nexus (nexus/), the Grafana
        # dashboards (monitoring/), and the EKS cluster's own settings and
        # Secrets (k8s/eks, k8s/eks/secrets).
        run: |
          for kustomization in k8s/overlays/local k8s/overlays/aws k8s/overlays/loadtest k8s/overlays/saturation jenkins jenkins/eks nexus monitoring k8s/eks k8s/eks/secrets k8s/ops; do
            echo "── $kustomization ──"
            kubectl kustomize "$kustomization" > /tmp/rendered.yaml
            docker run --rm -i "$KUBECONFORM" \
              -strict -summary -kubernetes-version "$K8S_VERSION" \
              -schema-location default -schema-location "$CRD_SCHEMAS" < /tmp/rendered.yaml
          done

      - name: cluster-up pins the ops image by digest
        # k8s/ops renames its image to a placeholder tag first; the layer
        # cluster-up writes over it must replace that, or admission meets the
        # placeholder. It once didn't, and only the first kind-e2e run found it (D-099).
        run: |
          work="$(mktemp -d "$PWD/.cluster-up-ops-XXXX")"
          digest="sha256:$(printf 'e%.0s' $(seq 64))"
          node --input-type=module -e "
            import { writeFileSync } from 'node:fs';
            import { opsKustomization } from './scripts/lib/ops-platform.mjs';
            writeFileSync(process.argv[1] + '/kustomization.yaml', JSON.stringify(opsKustomization('ghcr.io/sayandip-jana-1018/splitx@' + process.argv[2])));
          " "$work" "$digest"
          images="$(kubectl kustomize "$work" | sed -n 's/^ *image: //p' | sort -u)"
          rm -rf "$work"
          echo "$images"
          test "$images" = "ghcr.io/sayandip-jana-1018/splitx@$digest"

      - name: Alert rules fire when they should, and the Alertmanager config is valid
        # promtool and amtool at the versions the cluster runs. The rules are
        # read from the PrometheusRule that is deployed, not from a copy.
        run: node scripts/test-alerts.mjs

      - name: No overlay runs a moving tag
        # A moving tag makes a rollback meaningless: the same manifest would
        # deploy different code tomorrow. This checked only the local overlay
        # until the AWS one was found pinning ECR :latest (D-059).
        run: |
          failed=0
          for overlay in local aws loadtest saturation; do
            if kubectl kustomize "k8s/overlays/$overlay" | grep -E '^\s+image: .*:(latest|main|stable)$'; then
              echo "k8s/overlays/$overlay pins a moving tag" >&2
              failed=1
            fi
          done
          exit "$failed"

  iac:
    # The CloudFormation templates: AWS's own linter (types, properties, IAM
    # policy shape, region support), then Trivy's misconfiguration checks at
    # high and critical. Nothing here touches AWS.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRIVY: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: cfn-lint
        run: |
          pipx install cfn-lint==1.57.0
          cfn-lint --regions ap-south-1 -- cloudformation/*.yaml

      - name: Trivy misconfigurations
        # A gate: any finding at medium or above fails the build. The two
        # accepted ones are marked in the templates, each with its reason.
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY" config \
            --severity MEDIUM,HIGH,CRITICAL --exit-code 1 cloudformation

  terraform:
    # terraform/edge and terraform/platform: Trivy's misconfiguration checks as
    # a gate, formatting, each root validated against its pinned modules and
    # providers (with the committed lock files), and tflint with the AWS rules.
    # Nothing here touches AWS: init runs without a backend, and applying is
    # for the aws-* workflows alone.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRIVY: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Trivy misconfigurations
        # On the clean checkout, before init: Trivy fetches the registry modules
        # itself and checks what they would create with the inputs we give them.
        # Any finding at medium or above fails the build; the accepted ones are
        # marked in the code, each with its reason.
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY" config \
            --severity MEDIUM,HIGH,CRITICAL --exit-code 1 terraform

      # The steps below run even after one fails (!cancelled()), so one run
      # shows every problem; any failed step still fails the job.
      - name: Terraform version
        id: terraform
        if: ${{ !cancelled() }}
        run: echo "version=$(cat terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        if: ${{ !cancelled() }}
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          terraform_wrapper: false

      - name: Formatting
        if: ${{ !cancelled() }}
        run: terraform fmt -check -recursive -diff terraform

      - name: Each root validates
        if: ${{ !cancelled() }}
        run: |
          # Both roots use the same AWS provider: download it once.
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/terraform-plugins"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          failed=0
          for root in edge platform; do
            echo "── $root ──"
            terraform -chdir="terraform/$root" init -backend=false -input=false \
              && terraform -chdir="terraform/$root" validate || failed=1
          done
          exit "$failed"

      - name: The lock files are committed as init makes them
        # init writes a lock file when none is committed, or rewrites a stale
        # one. The committed ones must already be what init makes, so every run
        # (aws-up included) installs providers whose checksums were reviewed.
        if: ${{ !cancelled() }}
        run: |
          if ! git diff --quiet -- terraform || [ -n "$(git ls-files --others --exclude-standard -- terraform)" ]; then
            git status --short -- terraform
            for root in edge platform; do
              echo "── terraform/$root/.terraform.lock.hcl ──"
              cat "terraform/$root/.terraform.lock.hcl"
            done
            echo "::error::Commit the lock files above as terraform/<root>/.terraform.lock.hcl."
            exit 1
          fi

      - name: Install tflint
        if: ${{ !cancelled() }}
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0

      - name: tflint
        if: ${{ !cancelled() }}
        env:
          # The AWS ruleset is a plugin downloaded from GitHub.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$PWD/terraform/.tflint.hcl"
          for root in edge platform; do
            echo "── $root ──"
            tflint --chdir="terraform/$root" --config="$PWD/terraform/.tflint.hcl"
          done

  sonar:
    # SonarQube Cloud: bugs, code smells, duplication, security hotspots, and
    # the unit tests' coverage (from verify, not a second test run). The
    # quality gate's verdict fails this job. It runs once the repository has
    # the organization and project keys (variables SONAR_ORGANIZATION and
    # SONAR_PROJECT_KEY, as SonarQube Cloud shows them) and a token (secret
    # SONAR_TOKEN); until then it is skipped, not failed.
    needs: verify
    if: ${{ vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: Sonar tells new code from old by it.
          fetch-depth: 0

      - name: Coverage from verify
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage

      - name: Scan, and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true

  release:
    # A commit on main that passed every job above becomes a release: built
    # once, published, scanned, signed, and handed to Jenkins as a GitHub
    # deployment. Jenkins deploys only images this job signed (D-054).
    needs: [verify, integration, database, e2e, secret-scan, manifests, iac, terraform]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One release at a time, in commit order, so deployments arrive in order too.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write     # publish to ghcr.io
      id-token: write     # keyless signing: GitHub's OIDC token names this workflow as the signer
      deployments: write  # ask Jenkins to deploy, through a GitHub deployment and its webhook
      security-events: write # the image's vulnerabilities, in the Security tab
    env:
      IMAGE: ghcr.io/sayandip-jana-1018/splitx
      TRIVY: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
      COSIGN_VERSION: v3.1.3

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provenance values
        # The same three values scripts/image-build.mjs computes locally. They
        # become OCI labels and splitx_app_info{version, git_sha} in Prometheus.
        id: provenance
        run: |
          git_sha="${GITHUB_SHA::12}"
          version="$(node -p 'require("./package.json").version')"
          {
            echo "git_sha=$git_sha"
            echo "app_version=$version+$git_sha"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        # The `release` bake target: the production image plus a provenance
        # attestation and an SBOM, exactly what `npm run image:build -- release`
        # builds. Tagged with the commit only; a moving tag is never published.
        # With it, `ops-release`: ops-api and the traffic lab (ops/, D-097), the
        # same package tagged ops-<commit>. A release is both images.
        id: build
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: docker-bake.hcl
          targets: release,ops-release
          push: true
          vars: |
            REGISTRY=ghcr.io/sayandip-jana-1018/
            GIT_SHA=${{ steps.provenance.outputs.git_sha }}
            APP_VERSION=${{ steps.provenance.outputs.app_version }}
            BUILD_DATE=${{ steps.provenance.outputs.build_date }}
          set: |
            release.tags=${{ env.IMAGE }}:${{ steps.provenance.outputs.git_sha }}
            release.cache-from=type=gha,scope=release
            release.cache-to=type=gha,scope=release,mode=max
            ops-release.tags=${{ env.IMAGE }}:ops-${{ steps.provenance.outputs.git_sha }}
            ops-release.cache-from=type=gha,scope=ops
            ops-release.cache-to=type=gha,scope=ops,mode=max

      - name: Image digest
        id: image
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          digest="$(jq -r '.release["containerimage.digest"] // empty' <<<"$METADATA")"
          ops="$(jq -r '.["ops-release"]["containerimage.digest"] // empty' <<<"$METADATA")"
          if [[ "$digest" != sha256:* || "$ops" != sha256:* ]]; then
            echo "the build reported no digest (app '$digest', ops '$ops')" >&2
            exit 1
          fi
          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          echo "ops_ref=$IMAGE@$ops" >> "$GITHUB_OUTPUT"

      - name: Reports on the image
        # Every vulnerability at every severity (SARIF, for the Security tab), the
        # image's contents as a CycloneDX SBOM, and the vulnerability report in
        # the form cosign attaches. One vulnerability database, downloaded once.
        id: reports
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.image.outputs.ref }}
        run: |
          mkdir -p release-evidence "$RUNNER_TEMP/trivy"
          trivy() {
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
              -v "$RUNNER_TEMP/trivy:/root/.cache/trivy" -v "$PWD/release-evidence:/out" \
              "$TRIVY" image --no-progress "$@" "$REF"
          }
          trivy --format sarif --output /out/trivy.sarif --scanners vuln
          trivy --format cyclonedx --output /out/sbom.cdx.json --skip-db-update
          trivy --format cosign-vuln --output /out/vuln.json --skip-db-update
          ls -l release-evidence

      - name: Show the image's vulnerabilities in the Security tab
        if: ${{ always() && steps.reports.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: release-evidence/trivy.sarif
          category: trivy-image

      - name: Scan for vulnerabilities
        # An image with a critical or high vulnerability that has a fix is left
        # published but unsigned, and Jenkins deploys only signed images. The
        # ops image passes the same gate, and the cluster admits it only signed.
        # Its accepted exceptions (ops/.trivyignore.yaml) each name one file, a
        # reason and an expiry; the app's image has none.
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.image.outputs.ref }}
          OPS_REF: ${{ steps.image.outputs.ops_ref }}
        run: |
          scan() {
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
              -v "$RUNNER_TEMP/trivy:/root/.cache/trivy" -v "$PWD/ops:/ops:ro" "$TRIVY" image --skip-db-update \
              --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress "$@"
          }
          echo "── the app: $REF"
          scan "$REF"
          echo "── ops-api and the traffic lab: $OPS_REF"
          scan --ignorefile /ops/.trivyignore.yaml "$OPS_REF"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign
        # Keyless: Sigstore's certificate authority issues a short-lived
        # certificate naming this workflow file, repository and branch, and the
        # signature is recorded in the public Rekor log. No key to leak or rotate.
        env:
          REF: ${{ steps.image.outputs.ref }}
          OPS_REF: ${{ steps.image.outputs.ops_ref }}
        run: cosign sign --yes "$REF" "$OPS_REF"

      - name: Attest the SBOM and the vulnerability report
        # Signed statements about this exact digest, made the same keyless way
        # and recorded in Rekor: what the image contains, and what was known to
        # be vulnerable in it when it was released. Anyone can check them with
        # `cosign verify-attestation --type cyclonedx|vuln`.
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: |
          cosign attest --yes --type cyclonedx --predicate release-evidence/sbom.cdx.json "$REF"
          cosign attest --yes --type vuln --predicate release-evidence/vuln.json "$REF"

      - name: Keep the release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ steps.provenance.outputs.git_sha }}
          path: release-evidence/
          retention-days: 30

      - name: Ask Jenkins to deploy it
        # A GitHub deployment for the environment "kind" (the rehearsal cluster).
        # GitHub sends it to Jenkins as a signed "deployment" webhook; Jenkins
        # verifies the signature on the webhook and on the image before deploying,
        # and reports the outcome back to this deployment.
        # The payload also names the release's ops image, which cluster-up runs
        # beside it (--ops-image); Jenkins deploys the app image only.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.image.outputs.ref }}
          OPS_REF: ${{ steps.image.outputs.ops_ref }}
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg image "$REF" --arg ops "$OPS_REF" '{
            ref: $sha, environment: "kind", auto_merge: false, required_contexts: [],
            production_environment: false, description: "Signed release",
            payload: {image: $image, ops_image: $ops}
          }' | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '"deployment \(.id) for \(.sha[0:12]) to \(.environment)"' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$REF\` |"
            echo "| Ops image (ops-api, traffic lab) | \`$OPS_REF\` |"
            echo "| Scan | no critical or high vulnerability with a fix, in either |"
            echo "| Signed by | \`$GITHUB_WORKFLOW_REF\` |"
            echo "| Attested | CycloneDX SBOM, vulnerability report (the app image) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ask Jenkins on EKS too, while the AWS platform is up
        # The EKS platform exists only on AWS days (aws-up builds it in the
        # morning, aws-down removes it at night). While it answers through the
        # edge, its Jenkins gets the release the same way, as a deployment for
        # "eks"; on any other day the edge shows its offline page and nothing
        # is asked of it (D-093). The edge's address is the one committed in
        # k8s/overlays/aws.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.image.outputs.ref }}
          OPS_REF: ${{ steps.image.outputs.ops_ref }}
        run: |
          url="$(sed -n 's|^ *- NEXTAUTH_URL=\(https://[a-z0-9.-]*\)$|\1|p' k8s/overlays/aws/kustomization.yaml)"
          if [[ -z "$url" ]]; then
            echo "k8s/overlays/aws has no edge address yet: nothing to deploy on AWS."
            exit 0
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$url/api/health/live" || true)"
          if [[ "$code" != 200 ]]; then
            echo "The AWS platform is offline ($url/api/health/live answered $code): nothing to deploy there."
            exit 0
          fi
          jq -n --arg sha "$GITHUB_SHA" --arg image "$REF" --arg ops "$OPS_REF" '{
            ref: $sha, environment: "eks", auto_merge: false, required_contexts: [],
            production_environment: false, transient_environment: true,
            description: "Signed release, on the AWS platform", payload: {image: $image, ops_image: $ops}
          }' | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '"deployment \(.id) for \(.sha[0:12]) to \(.environment)"' \
            | tee -a "$GITHUB_STEP_SUMMARY"
