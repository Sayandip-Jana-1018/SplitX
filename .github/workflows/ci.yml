name: SplitIT CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # postinstall generates the Prisma client from prisma/schema.prisma
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        # The unit suite with coverage (for SonarQube), then the hardening checks
        # `npm test` also runs.
        run: |
          npm run test:coverage
          node tests/production-hardening.test.mjs

      - name: Keep the coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

      - name: Lint
        run: npm run lint

      # No file, dependency, export or type that nothing uses (knip.jsonc, D-111).
      - name: Nothing unused
        run: npm run lint:unused

      - name: Build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The integration suite fails instead of skipping when this is missing.
      REDIS_URL: redis://127.0.0.1:6379/15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Rate limiter against real Redis
        run: npm run test:integration

  database:
    # The schema, and the code that depends on it, against a real Postgres of
    # the version production runs (Neon reports 17.11): the migrations build an
    # empty database, schema.prisma has no change without a migration, and the
    # database tests pass (constraints, integer bounds, and two people writing at once).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          # A throwaway database on the runner: no password to keep, or to leak.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PG: postgresql://postgres@127.0.0.1:5432

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: One empty database per check
        env:
          POSTGRES: ${{ job.services.postgres.id }}
        run: |
          for db in migrated shadow splitx_test; do
            docker exec "$POSTGRES" createdb -U postgres "$db"
          done

      - name: The migrations build an empty database
        run: DATABASE_URL="$PG/migrated" DIRECT_URL="$PG/migrated" npx prisma migrate deploy

      - name: Nothing in schema.prisma is missing a migration
        run: |
          if ! DATABASE_URL="$PG/migrated" DIRECT_URL="$PG/migrated" npx prisma migrate diff \
               --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
               --shadow-database-url "$PG/shadow" --exit-code --script > missing.sql; then
            echo "::error::prisma/schema.prisma changes what no migration makes. Add one with: npx prisma migrate dev --name <what_it_does>"
            cat missing.sql
            exit 1
          fi
          cat missing.sql

      - name: Database tests
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/splitx_test
          DIRECT_URL: postgresql://postgres@127.0.0.1:5432/splitx_test
        # With coverage: the phone app's API (src/lib/v1, its services and routes) is
        # proven against this real database, not by the unit suite, and Sonar counts both.
        run: |
          npx prisma migrate deploy
          npm run test:db:coverage

      - name: Keep the coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-database
          path: coverage-database/lcov.info
          retention-days: 7

  e2e:
    # The flows a classroom uses, in a phone's browser (Playwright, D-107): an
    # account, a group and its invite link, expenses split equally and by
    # amounts, changed and removed, settling up through each state, removing a
    # member, and a shared phone after sign-out. Against a production build, on
    # a real Postgres and Redis, as production runs.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: splitx_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/splitx_e2e
      DIRECT_URL: postgresql://postgres@127.0.0.1:5432/splitx_e2e
      # The rate limiter's shared store, as on Vercel (Upstash).
      REDIS_URL: redis://127.0.0.1:6379/0
      NEXTAUTH_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: 'true'
      AI_DISABLED: 'true'
      NEXT_TELEMETRY_DISABLED: 1
      E2E_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: A session secret for this run only
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "NEXTAUTH_SECRET=$secret" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Migrate the database
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Serve the build, as production does
        run: |
          nohup npx next start -p 3000 > next.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health/ready > /dev/null && exit 0
            sleep 1
          done
          cat next.log
          exit 1

      - name: The flows
        run: npx playwright test

      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
            next.log
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks

      - name: Scan every commit for secrets
        # Findings in historical commits whose secrets were rotated are listed by
        # fingerprint in .gitleaksignore; anything new fails the build.
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  sonar:
    # SonarQube Cloud: bugs, code smells, duplication, security hotspots, and
    # the unit tests' coverage (from verify, not a second test run). The
    # quality gate's verdict fails this job. It runs once the repository has
    # the organization and project keys (variables SONAR_ORGANIZATION and
    # SONAR_PROJECT_KEY, as SonarQube Cloud shows them) and a token (secret
    # SONAR_TOKEN); until then it is skipped, not failed.
    needs: [verify, database]
    if: ${{ vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: Sonar tells new code from old by it.
          fetch-depth: 0

      - name: Coverage from verify
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage

      - name: Coverage from the database tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-database
          path: coverage-database

      - name: Scan, and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
