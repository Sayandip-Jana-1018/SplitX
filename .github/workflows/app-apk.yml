# The phone app as an APK to install, built on GitHub's machines: a native Android build
# would hold the laptop's CPU at full load for 15-25 minutes, and with one fan it can't take
# that heat. Every push to feat/app that touches the app, or the website code it shares,
# builds one; it is the run's "splitit-apk" artifact.
#
# The APK is signed with React Native's standard debug key, which is fine for installing on
# your own phone and not for a store. Each build's versionCode is the run number, so a newer
# APK always installs over an older one.
name: App APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/app
    paths:
      - apps/mobile/**
      - src/lib/**
      - .github/workflows/app-apk.yml
      # Notes don't change the app: a README edit shouldn't cost a 20-minute build.
      - '!**/*.md'

permissions:
  contents: read

# A newer push makes the older build pointless.
concurrency:
  group: app-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # An app that doesn't type-check or breaks its own lint rules isn't built. The app's types
    # reach into the website code it shares (src/lib, which uses zod), so this job installs the
    # website's packages as well as the app's. The build below doesn't: its environment stays
    # exactly as it was.
    name: Type-check and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install the website's packages (types only, no scripts)
        run: npm ci --ignore-scripts

      - name: Install the app's packages
        working-directory: apps/mobile
        run: npm ci

      - name: Type-check
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Lint
        working-directory: apps/mobile
        run: npx eslint . --max-warnings 0

  apk:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      - name: Number this build
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          "

      # Firebase's Android config, for push notifications (Phase 3). Kept out of the
      # public repository: the GOOGLE_SERVICES_JSON secret holds the file the
      # Firebase console gives. Without it the APK builds the same, without pushes
      # (app.config.js adds the file only when it is there).
      - name: Firebase config for push notifications
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            node -e "const c = JSON.parse(require('fs').readFileSync('google-services.json', 'utf8')); if (!c.client?.some((x) => x.client_info?.android_client_info?.package_name === 'app.splitit')) { console.error('google-services.json has no app.splitit client'); process.exit(1); }"
            echo "Push notifications: on"
          else
            echo "::notice::No GOOGLE_SERVICES_JSON secret: this APK has no push notifications."
          fi

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # 64-bit ARM only: every phone sold in years, and a quarter of the build time.
      # Crash reports (Sentry) get readable stack traces only with source maps, which need
      # a SENTRY_AUTH_TOKEN secret; without it the upload is skipped, not failed.
      - name: Build the APK
        working-directory: apps/mobile/android
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then export SENTRY_DISABLE_AUTO_UPLOAD=true; fi
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Keep the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: splitit-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error
